name: Jotunland
version: "0.4.0"
slug: jotunland
description: Smarthome-Oberfläche mit automatischer Geräteerkennung, PV-Überschussladen und Heizungssteuerung
url: https://github.com/noledge5/jotunland-smarthome
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:home-lightning-bolt
panel_title: Jotunland
# Zugriff auf die Home-Assistant-API (Geräte, Dienste, Konfigurationsprüfung)
homeassistant_api: true
# nur für "In Seitenleiste anzeigen" beim ersten Start (/addons/self/options)
hassio_api: true
# Schreibzugriff auf /config, um Paket und Blueprint zu installieren
map:
  - type: homeassistant_config
    read_only: false
