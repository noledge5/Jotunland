<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jotunland — Avarr</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #14110f; --panel: #1d1916; --panel2: #241f1b; --border: #3a322b;
    --text: #d8cfc2; --dim: #8a7f70; --accent: #a33b2e; --gold: #b8963f;
    --green: #5d7a4c; --red: #9c3a30;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.55 Georgia, 'Times New Roman', serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 17px; letter-spacing: 3px; color: var(--gold); font-weight: normal; }
  header .spacer { flex: 1; }
  select, input[type=text], input[type=number], button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    padding: 5px 9px; font: inherit; font-size: 13px; border-radius: 3px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #f0e6d8; }
  main { flex: 1; display: flex; min-height: 0; }
  #chatcol { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 18px 22px; }
  .msg { max-width: 780px; margin: 0 auto 16px; white-space: pre-wrap; }
  .msg.user { color: #c9b98a; border-left: 3px solid var(--gold); padding-left: 12px; }
  .msg.dm { }
  .msg.tool { font-family: monospace; font-size: 12px; color: var(--dim); }
  .msg.error { color: var(--red); font-family: monospace; font-size: 13px; }
  .msg.lint { color: #8a6d3b; font-family: monospace; font-size: 12px; }
  #inputbar { padding: 8px 14px 10px; background: var(--panel); border-top: 1px solid var(--border); }
  #modes { display: flex; gap: 6px; margin-bottom: 6px; }
  .modebtn { font-size: 12px; padding: 3px 10px; color: var(--dim); }
  .modebtn.active { border-color: var(--gold); color: var(--gold); }
  #inputrow { display: flex; gap: 8px; }
  #inputrow textarea {
    flex: 1; resize: none; height: 58px; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); padding: 8px; font: inherit; border-radius: 3px;
  }
  .laybtn { font-size: 12px; }
  .laybtn.active { border-color: var(--gold); color: var(--gold); }
  .wizgrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 3px 10px; font-size: 12px; }
  .wizgrid label { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .wizgrid input { width: 52px; text-align: center; }
  aside {
    width: 290px; background: var(--panel); border-left: 1px solid var(--border);
    padding: 14px; overflow-y: auto; font-size: 13px;
  }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--dim); margin: 14px 0 6px; }
  aside h2:first-child { margin-top: 0; }
  .stat { display: flex; justify-content: space-between; padding: 2px 0; }
  .hpbar { height: 8px; background: var(--panel2); border: 1px solid var(--border); border-radius: 3px; overflow: hidden; margin: 4px 0; }
  .hpbar > div { height: 100%; background: var(--green); }
  .tag { display: inline-block; background: var(--panel2); border: 1px solid var(--border); border-radius: 3px; padding: 1px 6px; margin: 2px 2px 0 0; font-size: 12px; }
  #combatbox { border: 1px solid var(--red); border-radius: 3px; padding: 8px; margin-top: 6px; display: none; }
  #combatbox.active { display: block; }
  /* Modale Dialoge */
  .modal, #rolldlg {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65);
    align-items: center; justify-content: center; z-index: 10;
  }
  .modal.open, #rolldlg.open { display: flex; }
  .modal .box, #rolldlg .box {
    background: var(--panel); border: 1px solid var(--gold); border-radius: 4px;
    padding: 22px; width: 340px; text-align: center;
  }
  .modal .box h3, #rolldlg .box h3 { color: var(--gold); margin-bottom: 8px; font-weight: normal; }
  #rolldlg .die { font-size: 42px; color: var(--gold); margin: 10px 0; font-family: Georgia, serif; }
  .modal select, .modal input, .modal textarea {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    padding: 6px; font: inherit; font-size: 13px; border-radius: 3px;
  }
  /* Netz / Karte (Wiki-Graph) */
  #graphview { display: none; flex: 1; min-height: 0; }
  #graphview.open { display: flex; }
  #graphwrap { flex: 1; padding: 10px; min-width: 0; position: relative; }
  #graphsvg { width: 100%; height: 100%; background: #171310; border: 1px solid var(--border); border-radius: 4px; cursor: grab; }
  #graphsvg.panning { cursor: grabbing; }
  .gedge { stroke: #3a322b; stroke-width: 1; }
  .gedge.hl { stroke: var(--gold); stroke-width: 1.5; }
  .gnode { cursor: pointer; stroke: #000; stroke-width: .5; }
  .gnode.sel { stroke: var(--gold); stroke-width: 2.5; }
  .glabel { fill: #9a8f80; font-size: 9px; font-family: Georgia, serif; pointer-events: none; }
  #graphtools { position: absolute; top: 18px; left: 18px; display: flex; gap: 6px; flex-wrap: wrap; max-width: 60%; }
  #graphtools .tag { cursor: pointer; user-select: none; }
  #graphtools .tag.off { opacity: .35; }
  #graphsearch { width: 150px; }
  #editor {
    width: 320px; background: var(--panel); border-left: 1px solid var(--border);
    padding: 14px; overflow-y: auto; font-size: 13px; display: none;
  }
  #editor.open { display: block; }
  #editor h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--dim); margin: 12px 0 4px; }
  #editor h2:first-child { margin-top: 0; }
  #editor input[type=text], #editor textarea, #editor select {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); padding: 6px; font: inherit; font-size: 13px;
    border-radius: 3px; margin-bottom: 4px;
  }
  #editor textarea { min-height: 180px; resize: vertical; }
  #ed-msg { font-size: 12px; margin-top: 6px; }
  #ed-msg.ok { color: var(--green); } #ed-msg.err { color: var(--red); }
  .backlink { display: inline-block; color: var(--gold); cursor: pointer; margin-right: 8px; font-size: 12px; }
  @media (max-width: 720px) { aside { display: none; } }
</style>
</head>
<body>
<header>
  <h1>JOTUNLAND</h1>
  <select id="pcsel" title="Charakter"></select>
  <button id="newpc">Neuer PC</button>
  <button id="graphbtn">Welt</button>
  <button id="protbtn" title="Session-Protokoll ins Journal schreiben">Protokoll</button>
  <div class="spacer"></div>
  <input type="text" id="model" size="30" title="Modell-ID (or/..., gemini-..., claude-...)">
  <button id="savemodel">Modell setzen</button>
</header>
<main>
  <div id="chatcol">
    <div id="log"></div>
    <div id="graphview">
      <div id="graphwrap">
        <svg id="graphsvg"></svg>
        <div id="graphtools">
          <button id="layout-netz" class="laybtn active">Netz</button>
          <button id="layout-karte" class="laybtn">Karte</button>
          <span style="width:8px"></span>
          <button id="mode-ansehen" class="laybtn active" title="Nur ansehen und auswaehlen">Ansehen</button>
          <button id="mode-bearbeiten" class="laybtn" title="Verschieben und anlegen">Bearbeiten</button>
          <span style="width:8px"></span>
          <button id="filter-charakter" class="laybtn" title="Nur charaktergebundene Eintraege (Review-Inbox)">Nur charaktergebunden</button>
          <input type="text" id="graphsearch" placeholder="Suche...">
          <button id="gnew" title="Neuen Eintrag anlegen">Neu</button>
        </div>
      </div>
      <div id="editor"></div>
    </div>
    <div id="inputbar">
      <div id="modes">
        <button class="modebtn active" data-mode="handeln">Handeln</button>
        <button class="modebtn" data-mode="sprechen">Sprechen</button>
        <button class="modebtn" data-mode="dm">DM-Frage</button>
        <button class="modebtn" data-mode="korrektur">Korrektur</button>
      </div>
      <div id="inputrow">
        <textarea id="inp" placeholder="Was tust du?"></textarea>
        <button id="send" class="primary">Senden</button>
      </div>
    </div>
  </div>
  <aside id="sidebar"></aside>
</main>

<div id="newdlg" class="modal">
  <div class="box" style="width:380px; text-align:left;">
    <h3>Neuer Eintrag</h3>
    <div id="newdlg-coords" style="color:var(--dim); font-size:12px; margin-bottom:8px;"></div>
    <select id="nd-type">
      <option value="location">Ort</option><option value="city">Stadt</option>
      <option value="zone">Zone</option><option value="scene">Szene</option>
      <option value="character">Charakter</option><option value="lore">Lore</option>
      <option value="flora">Flora</option><option value="fauna">Fauna</option>
      <option value="faction">Fraktion</option>
    </select>
    <input type="text" id="nd-name" placeholder="Name" style="width:100%; margin:6px 0;">
    <textarea id="nd-body" placeholder="Beschreibung" style="width:100%; min-height:90px;"></textarea>
    <div style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end;">
      <button id="nd-cancel">Abbrechen</button>
      <button id="nd-save" class="primary">Anlegen</button>
    </div>
  </div>
</div>

<div id="wizdlg" class="modal">
  <div class="box" style="width:560px; max-height:88vh; overflow-y:auto; text-align:left;">
    <h3>Neuer Charakter</h3>
    <input type="text" id="wz-name" placeholder="Name (Pflicht)" style="width:100%; margin:6px 0;">
    <select id="wz-klasse" style="width:100%;"></select>
    <textarea id="wz-hg" placeholder="Hintergrund (optional, nur Flavor)" style="width:100%; min-height:50px; margin:6px 0;"></textarea>
    <h4 style="color:var(--gold); margin:10px 0 4px;">Attribute — Pool: <span id="wz-apool"></span></h4>
    <div id="wz-attrs" class="wizgrid"></div>
    <h4 style="color:var(--gold); margin:10px 0 4px;">Skills — Pool: <span id="wz-spool"></span></h4>
    <div id="wz-skills" class="wizgrid"></div>
    <div id="wz-err" style="color:var(--red); font-size:12px; margin-top:6px;"></div>
    <div style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end;">
      <button id="wz-cancel">Abbrechen</button>
      <button id="wz-save" class="primary">Erstellen</button>
    </div>
  </div>
</div>

<div id="rolldlg">
  <div class="box">
    <h3>Angriffswurf</h3>
    <div id="rollinfo" style="color:var(--dim); font-size:13px;"></div>
    <div class="die" id="dieface">d20</div>
    <input type="number" id="rollval" min="1" max="20" placeholder="1-20" style="width:80px; text-align:center;">
    <div style="margin-top:12px; display:flex; gap:8px; justify-content:center;">
      <button id="autoroll">Selbst wuerfeln lassen</button>
      <button id="submitroll" class="primary">Wurf eintragen</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let streaming = false;

function el(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text || '';
  $('log').appendChild(d);
  $('log').scrollTop = $('log').scrollHeight;
  return d;
}

async function api(path, opts) {
  const r = await fetch(path, {headers: {'Content-Type': 'application/json'}, ...opts});
  if (!r.ok) {
    let detail = r.statusText;
    try { detail = (await r.json()).detail || detail; } catch {}
    throw new Error(detail);
  }
  return r;
}

// --- State / Sidebar ---
async function refreshState() {
  const s = await (await api('/api/state')).json();
  $('model').value = s.settings.model || '';
  const pcs = await (await api('/api/pcs')).json();
  $('pcsel').innerHTML = pcs.map(p =>
    `<option value="${p.slug}" ${p.slug === s.settings.active_pc_slug ? 'selected' : ''}>${p.name} (Lv ${p.level})</option>`
  ).join('') || '<option value="">— kein PC —</option>';
  renderSidebar(s.pc);
  if (s.awaiting_roll) openRollDialog(s.awaiting_roll);
  return s;
}

function fmtKal(k) {
  if (!k) return '';
  const p = n => String(n).padStart(2, '0');
  return `${p(k.tag)}.${p(k.monat)}.${k.jahr} IC — ${p(k.stunde)}:${p(k.minute)}`;
}

function renderSidebar(pc) {
  const sb = $('sidebar');
  if (!pc) { sb.innerHTML = '<h2>Kein aktiver Charakter</h2><p style="color:var(--dim)">Lege oben einen PC an.</p>'; return; }
  const hpPct = Math.max(0, Math.min(100, pc.hp / pc.hp_max * 100));
  const coins = pc.coins || {};
  const fmtCoins = ['gm','sm','kp'].map(k => coins[k] ? coins[k] + ' ' + k : '').filter(Boolean).join(' ') || '0 kp';
  const mod = v => { const m = Math.floor((v - 10) / 2); return m >= 0 ? '+' + m : m; };
  let html = `<h2>${pc.name} — ${pc.klasse || ''}, Level ${pc.level}</h2>
    <div class="stat"><span>Zeit</span><span>${fmtKal(pc.kalender)}</span></div>
    <div class="stat"><span>HP</span><span>${pc.hp}/${pc.hp_max} (${pc.hp_status || ''})</span></div>
    <div class="hpbar"><div style="width:${hpPct}%${pc.hp <= 0 ? ';background:var(--red)' : ''}"></div></div>`;
  if (pc.hp <= 0 && !pc.stabilisiert) html += `<div style="color:var(--red)">STERBEND — blutet jede Runde</div>`;
  html += `<div class="stat"><span>Skill-Ups</span><span>${pc.skill_ups || 0} (Level bei ${(pc.level) * 10})</span></div>
    <div class="stat"><span>Boerse</span><span>${fmtCoins}</span></div>`;
  if (pc.attr_punkte_frei) html += `<div class="stat" style="color:var(--gold)"><span>Freie Attributpunkte</span><span>${pc.attr_punkte_frei}</span></div>`;
  const attr = pc.attribute || {};
  html += '<h2>Attribute</h2>' + Object.entries(attr).map(([k,v]) =>
    `<div class="stat"><span>${k}</span><span>${v} (${mod(v)})</span></div>`).join('');
  const skills = Object.entries(pc.skills || {}).filter(([,s]) => s.wert > 0)
    .sort((a,b) => b[1].wert - a[1].wert);
  if (skills.length) html += '<h2>Skills</h2>' + skills.map(([n,s]) =>
    `<div class="stat"><span>${n}</span><span>${s.wert} <span style="color:var(--dim)">(${s.ticks}t)</span></span></div>`).join('');
  if (pc.location) html += `<h2>Ort</h2><div>${pc.location.name}</div>`;
  const verl = pc.verletzungen || [];
  if (verl.length) html += '<h2>Verletzungen</h2>' + verl.map(v => `<span class="tag">${v.name} (${v.modifikator})</span>`).join('');
  const inv = pc.inventar || [];
  if (inv.length) html += '<h2>Inventar</h2>' + inv.map(i => `<span class="tag">${i.name} x${i.menge || 1}${i.equipped ? ' ✦' : ''}</span>`).join('');
  const fx = pc.status_effekte || [];
  if (fx.length) html += '<h2>Status</h2>' + fx.map(e => `<span class="tag">${e}</span>`).join('');
  const quests = (pc.quests || []).filter(q => q.status !== 'abgeschlossen');
  if (quests.length) html += '<h2>Quests</h2>' + quests.map(q => `<div>• ${q.titel} <span style="color:var(--dim)">[${q.status}]</span></div>`).join('');
  if (pc.combat) {
    html += `<h2 style="color:var(--red)">Kampf — Runde ${pc.combat.round} (${pc.combat.phase})</h2>` +
      pc.combat.enemies.map(e => `<div class="stat"><span>${e.name}</span><span>${e.hp}/${e.hp_max}</span></div>`).join('');
  }
  sb.innerHTML = html;
}

// --- SSE-Stream verarbeiten ---
async function consumeStream(response, dmDiv) {
  const reader = response.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      if (!line.startsWith('data:')) continue;
      let ev;
      try { ev = JSON.parse(line.slice(5)); } catch { continue; }
      if (ev.type === 'text') {
        if (!dmDiv) dmDiv = el('dm');
        dmDiv.textContent += ev.text;
        $('log').scrollTop = $('log').scrollHeight;
      } else if (ev.type === 'tool') {
        el('tool', '⚙ ' + ev.name + ' → ' + ev.result);
        dmDiv = null;
      } else if (ev.type === 'gate') {
        el('tool', `⚑ Probe noetig: ${ev.skill} (${ev.tier})${ev.grund ? ' — ' + ev.grund : ''}`);
        dmDiv = null;
      } else if (ev.type === 'awaiting_roll') {
        openRollDialog(ev.pending);
      } else if (ev.type === 'gamestate') {
        renderSidebar(ev.pc);
      } else if (ev.type === 'lint') {
        el('lint', 'Wiki-Lint: ' + ev.problems.join(' | '));
      } else if (ev.type === 'validator') {
        el('lint', 'Validator: ' + ev.problems.join(' | '));
      } else if (ev.type === 'error') {
        el('error', 'Fehler: ' + ev.error);
      }
    }
  }
}

let currentMode = 'handeln';
document.querySelectorAll('.modebtn').forEach(b => b.onclick = () => {
  currentMode = b.dataset.mode;
  document.querySelectorAll('.modebtn').forEach(x => x.classList.toggle('active', x === b));
  $('inp').placeholder = {handeln: 'Was tust du?', sprechen: 'Was sagst du?',
    dm: 'Frage an den Spielleiter (kein Zeitfortschritt)',
    korrektur: 'Was war falsch an der letzten Erzaehlung?'}[currentMode];
});

async function send() {
  const text = $('inp').value.trim();
  if (!text || streaming) return;
  $('inp').value = '';
  el('user', (currentMode !== 'handeln' ? `[${currentMode.toUpperCase()}] ` : '') + text);
  streaming = true; $('send').disabled = true;
  try {
    const r = await api('/api/chat', {method: 'POST',
      body: JSON.stringify({message: text, mode: currentMode})});
    await consumeStream(r, null);
  } catch (e) { el('error', e.message); }
  streaming = false; $('send').disabled = false;
}

// --- Wuerfel ---
function openRollDialog(pending) {
  let info = `${pending.skill} — ${pending.tier} (SG ${pending.sg})`;
  if (pending.ziel) info += ` — Angriff auf ${pending.ziel}`;
  if (pending.beschreibung) info += ' — ' + pending.beschreibung;
  $('rollinfo').textContent = info;
  $('rollval').value = '';
  $('rolldlg').classList.add('open');
}

async function submitRoll(v) {
  if (!(v >= 1 && v <= 20)) return;
  $('rolldlg').classList.remove('open');
  el('user', `[Wurf: ${v}]`);
  streaming = true; $('send').disabled = true;
  try {
    const r = await api('/api/roll', {method: 'POST', body: JSON.stringify({wurf: v})});
    await consumeStream(r, null);
  } catch (e) { el('error', e.message); }
  streaming = false; $('send').disabled = false;
}

$('submitroll').onclick = () => submitRoll(parseInt($('rollval').value, 10));
$('autoroll').onclick = () => {
  const v = 1 + Math.floor(Math.random() * 20);
  $('dieface').textContent = v;
  setTimeout(() => submitRoll(v), 600);
};

// --- Ansichten: chat / graph (Netz+Karte) ---
let view = 'chat';
function showView(v) {
  view = v;
  $('log').style.display = v === 'chat' ? '' : 'none';
  $('inputbar').style.display = v === 'chat' ? '' : 'none';
  $('graphview').classList.toggle('open', v === 'graph');
  $('graphbtn').textContent = v === 'graph' ? 'Chat' : 'Welt';
}

// --- Welt-Editor: EIN Editor, zwei Layouts (Netz = Link-Graph,
//     Karte = Meter-Koordinaten). Klick auf leere Kartenstelle legt an.
const TYPE_COLORS = {
  canon: '#d4c9a0', realm: '#d4a017', region: '#b8963f', city: '#c8a040',
  zone: '#8a7a45', scene: '#6e5f3d', location: '#5d7a4c',
  character: '#5c7a9c', faction: '#a33b2e', noble_house: '#8a5c9c',
  lore: '#b8863f', economy: '#4c8a7a', law: '#8a8a7a', chronicle: '#707070',
  flora: '#4c8a4c', fauna: '#8a6a3c',
};
const M2U = 2500;  // Meter pro viewBox-Einheit (3.000 km -> 1200 Einheiten)
let G = {nodes: [], edges: [], adj: {}, sel: null, hiddenTypes: new Set(['scene']),
         layout: 'netz', edit: false, onlyChar: false, vb: {x: 0, y: 0, w: 1200, h: 900}, anim: null};

$('filter-charakter').onclick = () => {
  G.onlyChar = !G.onlyChar;
  $('filter-charakter').classList.toggle('active', G.onlyChar);
  renderGraph();
};

function setEdit(on) {
  G.edit = on;
  $('mode-ansehen').classList.toggle('active', !on);
  $('mode-bearbeiten').classList.toggle('active', on);
  $('gnew').style.display = on ? '' : 'none';
  $('graphsvg').style.cursor = on && G.layout === 'karte' ? 'crosshair' : 'grab';
}
$('mode-ansehen').onclick = () => setEdit(false);
$('mode-bearbeiten').onclick = () => setEdit(true);
setEdit(false);  // Startzustand: nur ansehen

async function openGraph() {
  showView('graph');
  const data = await (await api('/api/graph')).json();
  const N = data.nodes.length;
  const R = 450 + N * 1.2;
  G.nodes = data.nodes.map((n, i) => ({
    ...n,
    x: 600 + R * 0.5 * Math.cos(i * 2.399) * (0.3 + (i % 97) / 97),
    y: 450 + R * 0.4 * Math.sin(i * 2.399) * (0.3 + (i % 89) / 89),
    vx: 0, vy: 0, deg: 0,
  }));
  const bySlug = {};
  G.nodes.forEach(n => bySlug[n.slug] = n);
  G.adj = {};
  G.edges = data.edges.filter(([a, b]) => bySlug[a] && bySlug[b]);
  G.edges.forEach(([a, b]) => {
    bySlug[a].deg++; bySlug[b].deg++;
    (G.adj[a] = G.adj[a] || []).push(b);
    (G.adj[b] = G.adj[b] || []).push(a);
  });
  G.bySlug = bySlug;
  buildTypeFilter();
  runSim(280);
}

function visibleNodes() {
  const q = $('graphsearch').value.trim().toLowerCase();
  return G.nodes.filter(n => !G.hiddenTypes.has(n.type) &&
    (G.layout !== 'karte' || n.koordinaten) &&
    (!G.onlyChar || n.scope === 'charakter') &&
    (!q || n.slug.includes(q) || n.name.toLowerCase().includes(q)));
}

function nodePos(n) {
  if (G.layout === 'karte' && n.koordinaten)
    return {x: n.koordinaten[0] / M2U, y: 1200 - n.koordinaten[1] / M2U};
  return {x: n.x, y: n.y};
}

function setLayout(l) {
  G.layout = l;
  $('layout-netz').classList.toggle('active', l === 'netz');
  $('layout-karte').classList.toggle('active', l === 'karte');
  if (l === 'karte') {
    if (G.anim) cancelAnimationFrame(G.anim);
    G.vb = {x: 770, y: 290, w: 400, h: 460};  // Start: Ostimperium komplett
    renderGraph();
  } else {
    G.vb = {x: 0, y: 0, w: 1200, h: 900};
    runSim(60);
  }
  $('graphsvg').style.cursor = G.edit && l === 'karte' ? 'crosshair' : 'grab';
}
$('layout-netz').onclick = () => setLayout('netz');
$('layout-karte').onclick = () => setLayout('karte');

function runSim(ticks) {
  if (G.anim) cancelAnimationFrame(G.anim);
  let t = 0;
  const step = () => {
    const nodes = G.nodes, k = 42;
    for (let i = 0; i < 3; i++) simTick(nodes, k);
    t += 3;
    renderGraph();
    if (t < ticks) G.anim = requestAnimationFrame(step);
  };
  step();
}

function simTick(nodes, k) {
  const cool = 0.85;
  for (const a of nodes) { a.fx = (600 - a.x) * 0.002; a.fy = (450 - a.y) * 0.002; }
  // Abstossung (gitterfrei O(n²), reicht fuer ~300 Knoten)
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
      if (d2 > 90000) continue;
      const f = (k * k) / d2 * 0.9;
      const d = Math.sqrt(d2);
      a.fx += dx / d * f; a.fy += dy / d * f;
      b.fx -= dx / d * f; b.fy -= dy / d * f;
    }
  }
  // Federn entlang Kanten
  for (const [s1, s2] of G.edges) {
    const a = G.bySlug[s1], b = G.bySlug[s2];
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.max(Math.sqrt(dx * dx + dy * dy), 1);
    const f = (d - k * 2.2) * 0.015;
    a.fx += dx / d * f * 2; a.fy += dy / d * f * 2;
    b.fx -= dx / d * f * 2; b.fy -= dy / d * f * 2;
  }
  for (const a of nodes) {
    if (a.pinned) continue;
    a.vx = (a.vx + a.fx) * cool; a.vy = (a.vy + a.fy) * cool;
    a.x += Math.max(-8, Math.min(8, a.vx));
    a.y += Math.max(-8, Math.min(8, a.vy));
  }
}

function renderGraph() {
  const svg = $('graphsvg');
  svg.setAttribute('viewBox', `${G.vb.x} ${G.vb.y} ${G.vb.w} ${G.vb.h}`);
  const vis = new Set(visibleNodes().map(n => n.slug));
  const selAdj = G.sel ? new Set([G.sel, ...(G.adj[G.sel] || [])]) : null;
  const karte = G.layout === 'karte';
  const scale = G.vb.w / 1200;
  let out = '';
  for (const [a, b] of G.edges) {
    if (!vis.has(a) || !vis.has(b)) continue;
    const pa = nodePos(G.bySlug[a]), pb = nodePos(G.bySlug[b]);
    const hl = G.sel && (a === G.sel || b === G.sel);
    if (karte && !hl) continue;  // Karte: nur Kanten der Auswahl
    out += `<line class="gedge${hl ? ' hl' : ''}" x1="${pa.x.toFixed(1)}" y1="${pa.y.toFixed(1)}" x2="${pb.x.toFixed(1)}" y2="${pb.y.toFixed(1)}"/>`;
  }
  const zoomed = G.vb.w < 900;
  for (const n of G.nodes) {
    if (!vis.has(n.slug)) continue;
    const p = nodePos(n);
    const dim = selAdj && !selAdj.has(n.slug);
    const base = karte ? ({realm: 8, region: 6, city: 5, zone: 3.5, scene: 2.5}[n.type] || 3) * scale * 2
                       : 4 + Math.min(Math.sqrt(n.deg) * 2, 10);
    const r = Math.max(karte ? base : base, 1.5);
    const dash = n.scope === 'charakter' ? ' stroke-dasharray="2 2" stroke="#c98a3a"' : '';
    const title = `${n.name} [${n.type}]` + (n.scope === 'charakter' ? ' — charaktergebunden' : '') + (n.gesperrt ? ' — gesperrt' : '');
    out += `<circle class="gnode${n.slug === G.sel ? ' sel' : ''}" data-slug="${n.slug}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r.toFixed(1)}" fill="${TYPE_COLORS[n.type] || '#888'}"${dash} opacity="${dim ? 0.25 : 1}"><title>${title}</title></circle>`;
    const label = karte ? (zoomed || ['realm', 'region', 'city'].includes(n.type) || n.slug === G.sel)
                        : (zoomed || n.deg >= 6 || n.slug === G.sel);
    if (label)
      out += `<text class="glabel" x="${(p.x + r + 2).toFixed(1)}" y="${(p.y + 3).toFixed(1)}" font-size="${karte ? Math.max(9 * scale, 2).toFixed(1) : 9}" opacity="${dim ? 0.25 : 1}">${n.name}</text>`;
  }
  svg.innerHTML = out;
}

function buildTypeFilter() {
  const types = [...new Set(G.nodes.map(n => n.type))].sort();
  const tools = $('graphtools');
  tools.querySelectorAll('.tag').forEach(el => el.remove());
  for (const t of types) {
    const el = document.createElement('span');
    el.className = 'tag' + (G.hiddenTypes.has(t) ? ' off' : '');
    el.style.borderColor = TYPE_COLORS[t] || '#888';
    el.textContent = t;
    el.onclick = () => {
      G.hiddenTypes.has(t) ? G.hiddenTypes.delete(t) : G.hiddenTypes.add(t);
      el.classList.toggle('off');
      renderGraph();
    };
    tools.appendChild(el);
  }
}

// Pan / Zoom / Drag / Klick
(() => {
  const svg = $('graphsvg');
  let drag = null, pan = null;
  const pt = ev => {
    const r = svg.getBoundingClientRect();
    return {x: G.vb.x + (ev.clientX - r.left) / r.width * G.vb.w,
            y: G.vb.y + (ev.clientY - r.top) / r.height * G.vb.h};
  };
  svg.addEventListener('mousedown', ev => {
    const slug = ev.target.dataset && ev.target.dataset.slug;
    // Ziehen von Knoten nur im Bearbeiten-Modus und nicht bei gesperrten
    // Kanon-Orten (auf der Karte). Sonst zaehlt der Klick als Auswahl.
    const node = slug ? G.bySlug[slug] : null;
    const draggable = node && G.edit && !(G.layout === 'karte' && node.gesperrt);
    if (draggable) { drag = {n: node, moved: false}; node.pinned = true; }
    else { pan = {x: ev.clientX, y: ev.clientY, vx: G.vb.x, vy: G.vb.y,
                  moved: false, slug}; svg.classList.add('panning'); }
  });
  svg.addEventListener('mousemove', ev => {
    if (drag) {
      const p = pt(ev);
      if (G.layout === 'karte') {
        if (!drag.n.koordinaten) return;
        drag.n.koordinaten = [Math.round(p.x * M2U), Math.round((1200 - p.y) * M2U)];
      } else { drag.n.x = p.x; drag.n.y = p.y; }
      drag.moved = true;
      renderGraph();
    } else if (pan) {
      const r = svg.getBoundingClientRect();
      const nx = pan.vx - (ev.clientX - pan.x) / r.width * G.vb.w;
      const ny = pan.vy - (ev.clientY - pan.y) / r.height * G.vb.h;
      if (Math.abs(nx - G.vb.x) + Math.abs(ny - G.vb.y) > 0.5) pan.moved = true;
      G.vb.x = nx; G.vb.y = ny;
      renderGraph();
    }
  });
  window.addEventListener('mouseup', async ev => {
    if (drag) {
      if (!drag.moved) selectNode(drag.n.slug);
      else if (G.layout === 'karte' && drag.n.koordinaten) {
        // Verschieben auf der Karte = Koordinaten speichern
        try { await api('/api/wiki/' + drag.n.slug, {method: 'PUT',
          body: JSON.stringify({koordinaten: drag.n.koordinaten})}); } catch {}
      }
      drag.n.pinned = false; drag = null;
      return;
    }
    if (pan) {
      const wasClick = !pan.moved;
      const clickedSlug = pan.slug;
      pan = null; svg.classList.remove('panning');
      if (wasClick && clickedSlug) {
        selectNode(clickedSlug);          // Knoten anklicken = auswaehlen
      } else if (wasClick && G.edit && G.layout === 'karte' && ev.target.tagName === 'svg') {
        const p = pt(ev);                 // leere Kartenstelle im Bearbeiten-Modus = anlegen
        openNewDialog([Math.round(p.x * M2U), Math.round((1200 - p.y) * M2U)]);
      }
    }
  });
  svg.addEventListener('wheel', ev => {
    ev.preventDefault();
    const f = ev.deltaY > 0 ? 1.15 : 0.87;
    const p = pt(ev);
    G.vb.w *= f; G.vb.h *= f;
    G.vb.x = p.x - (p.x - G.vb.x) * f;
    G.vb.y = p.y - (p.y - G.vb.y) * f;
    renderGraph();
  }, {passive: false});
})();

async function selectNode(slug) {
  G.sel = slug;
  renderGraph();
  const e = await (await api('/api/wiki/' + slug)).json();
  const m = e.meta;
  const backlinks = G.edges.filter(([a, b]) => a === slug || b === slug)
    .map(([a, b]) => a === slug ? b : a);
  const scope = m.scope || 'welt';
  const gesperrt = !!m.gesperrt;
  const scopeLabel = scope === 'charakter'
    ? `Charaktergebunden${m.pc ? ' (' + m.pc + ')' : ''}`
    : 'Welt-Kanon';
  const scopeBtn = scope === 'charakter'
    ? `<button id="ed-promote" class="primary" style="width:100%">In den Kanon uebernehmen →</button>`
    : (gesperrt ? '' : `<button id="ed-demote" style="width:100%">An aktiven Charakter binden</button>`);
  const lockRow = m.koordinaten
    ? `<label style="display:flex;gap:6px;align-items:center;margin:6px 0;">
         <input type="checkbox" id="ed-lock" ${gesperrt ? 'checked' : ''} style="width:auto">
         Position gesperrt (Kanon-Ort, nicht verschiebbar)</label>`
    : '';
  $('editor').innerHTML = `
    <h2>${m.type} — ${slug}</h2>
    <div style="margin-bottom:6px;"><span class="tag" style="border-color:${scope === 'charakter' ? '#c98a3a' : 'var(--gold)'}">${scopeLabel}</span>${gesperrt ? '<span class="tag">gesperrt</span>' : ''}</div>
    ${scopeBtn}
    <input type="text" id="ed-name" value="${(m.name || '').replace(/"/g, '&quot;')}" placeholder="Name">
    <h2>Status</h2><input type="text" id="ed-status" value="${m.status || ''}" placeholder="z.B. aktiv, tot, ruhend">
    <h2>Tags</h2><input type="text" id="ed-tags" value="${(m.tags || []).join(', ')}" placeholder="komma, getrennt">
    <h2>Links (ausgehend)</h2><input type="text" id="ed-links" value="${(m.links || []).join(', ')}">
    ${lockRow}
    <h2>Text</h2><textarea id="ed-body">${e.body.replace(/</g, '&lt;')}</textarea>
    <button id="ed-save" class="primary">Speichern</button>
    <button id="ed-close">Schliessen</button>
    <div id="ed-msg"></div>
    <h2>Verbunden mit</h2>
    <div>${backlinks.map(b => `<span class="backlink" data-goto="${b}">${b}</span>`).join('') || '—'}</div>`;
  $('editor').classList.add('open');
  const setScope = async (target) => {
    try {
      await api('/api/wiki/' + slug + '/scope', {method: 'POST', body: JSON.stringify({scope: target})});
      await openGraphRefresh();
      selectNode(slug);
    } catch (err) { $('ed-msg').textContent = err.message; $('ed-msg').className = 'err'; }
  };
  if ($('ed-promote')) $('ed-promote').onclick = () => setScope('welt');
  if ($('ed-demote')) $('ed-demote').onclick = () => setScope('charakter');
  $('ed-save').onclick = async () => {
    const payload = {
      name: $('ed-name').value.trim(),
      status: $('ed-status').value.trim(),
      tags: $('ed-tags').value.split(',').map(s => s.trim()).filter(Boolean),
      links: $('ed-links').value.split(',').map(s => s.trim()).filter(Boolean),
      body: $('ed-body').value,
    };
    if (!payload.status) delete payload.status;
    if ($('ed-lock')) payload.gesperrt = $('ed-lock').checked;
    const msg = $('ed-msg');
    try {
      await api('/api/wiki/' + slug, {method: 'PUT', body: JSON.stringify(payload)});
      msg.textContent = 'Gespeichert.'; msg.className = 'ok';
      const n = G.bySlug[slug];
      if (n) { n.name = payload.name || n.name; if ('gesperrt' in payload) n.gesperrt = payload.gesperrt; }
      openGraphRefresh();
    } catch (err) { msg.textContent = err.message; msg.className = 'err'; }
  };
  $('ed-close').onclick = () => { G.sel = null; $('editor').classList.remove('open'); renderGraph(); };
  $('editor').querySelectorAll('[data-goto]').forEach(el =>
    el.onclick = () => selectNode(el.dataset.goto));
}

async function openGraphRefresh() {
  // Kanten neu laden ohne Layout-Reset
  const data = await (await api('/api/graph')).json();
  const known = new Set(G.nodes.map(n => n.slug));
  for (const n of data.nodes) {
    if (!known.has(n.slug)) {
      const nn = {...n, x: 600 + (Math.random() - .5) * 200, y: 450 + (Math.random() - .5) * 200, vx: 0, vy: 0, deg: 0};
      G.nodes.push(nn); G.bySlug[n.slug] = nn;
    } else {
      const ex = G.bySlug[n.slug];  // Scope/Sperre/Koordinaten aktualisieren
      ex.scope = n.scope; ex.gesperrt = n.gesperrt; ex.pc = n.pc;
      if (n.koordinaten) ex.koordinaten = n.koordinaten;
    }
  }
  G.edges = data.edges.filter(([a, b]) => G.bySlug[a] && G.bySlug[b]);
  G.nodes.forEach(n => n.deg = 0);
  G.adj = {};
  G.edges.forEach(([a, b]) => {
    G.bySlug[a].deg++; G.bySlug[b].deg++;
    (G.adj[a] = G.adj[a] || []).push(b);
    (G.adj[b] = G.adj[b] || []).push(a);
  });
  runSim(60);
}

$('graphbtn').onclick = () => view === 'graph' ? showView('chat') : openGraph();
$('graphsearch').oninput = () => renderGraph();

// --- Neuer Eintrag (Dialog, optional mit Kartenkoordinaten) ---
let newCoords = null;
function openNewDialog(coords) {
  newCoords = coords || null;
  $('newdlg-coords').textContent = coords
    ? `Position: x=${(coords[0] / 1000).toFixed(1)} km, y=${(coords[1] / 1000).toFixed(1)} km`
    : 'Ohne Koordinaten (nur im Netz sichtbar)';
  $('nd-name').value = ''; $('nd-body').value = '';
  $('newdlg').classList.add('open');
}
$('gnew').onclick = () => openNewDialog(null);
$('nd-cancel').onclick = () => $('newdlg').classList.remove('open');
$('nd-save').onclick = async () => {
  const name = $('nd-name').value.trim();
  if (!name) return;
  const payload = {type: $('nd-type').value, name, body: $('nd-body').value || '...'};
  if (newCoords) payload.koordinaten = newCoords;
  try {
    const r = await (await api('/api/wiki', {method: 'POST', body: JSON.stringify(payload)})).json();
    $('newdlg').classList.remove('open');
    await openGraphRefresh();
    selectNode(r.angelegt);
  } catch (err) { alert(err.message); }
};

// --- Header-Aktionen ---
$('send').onclick = send;
$('inp').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('savemodel').onclick = async () => {
  await api('/api/settings', {method: 'POST', body: JSON.stringify({model: $('model').value.trim()})});
  el('tool', 'Modell gesetzt: ' + $('model').value.trim());
};
$('pcsel').onchange = async () => {
  if ($('pcsel').value) { await api(`/api/pcs/${$('pcsel').value}/activate`, {method: 'POST'}); refreshState(); }
};
// --- Charakter-Wizard (Punktepools aus dem Rulebook) ---
let RULES = null;
$('newpc').onclick = async () => {
  if (!RULES) RULES = await (await api('/api/rules')).json();
  $('wz-klasse').innerHTML = Object.entries(RULES.classes).map(([k, c]) =>
    `<option value="${k}">${k} — ${c.starting_items.join(', ')}</option>`).join('');
  $('wz-attrs').innerHTML = RULES.attrs.map(a =>
    `<label>${a}<input type="number" class="wz-attr" data-attr="${a}" value="13" min="${RULES.attr_min}" max="${RULES.attr_max}"></label>`).join('');
  $('wz-skills').innerHTML = RULES.skills.map(s =>
    `<label title="${s.attrs.join('/')}">${s.name}<input type="number" class="wz-skill" data-skill="${s.name}" value="0" min="0" max="${RULES.skill_max}"></label>`).join('');
  const updatePools = () => {
    const asum = [...document.querySelectorAll('.wz-attr')].reduce((t, i) => t + (+i.value || 0), 0);
    const ssum = [...document.querySelectorAll('.wz-skill')].reduce((t, i) => t + (+i.value || 0), 0);
    $('wz-apool').textContent = `${asum}/${RULES.attr_pool}`;
    $('wz-apool').style.color = asum === RULES.attr_pool ? 'var(--green)' : 'var(--red)';
    $('wz-spool').textContent = `${ssum}/${RULES.skill_pool}`;
    $('wz-spool').style.color = ssum <= RULES.skill_pool ? 'var(--green)' : 'var(--red)';
  };
  document.querySelectorAll('.wz-attr, .wz-skill').forEach(i => i.oninput = updatePools);
  updatePools();
  $('wz-err').textContent = '';
  $('wizdlg').classList.add('open');
};
$('wz-cancel').onclick = () => $('wizdlg').classList.remove('open');
$('wz-save').onclick = async () => {
  const attribute = {}, skills = {};
  document.querySelectorAll('.wz-attr').forEach(i => attribute[i.dataset.attr] = +i.value || 0);
  document.querySelectorAll('.wz-skill').forEach(i => { if (+i.value > 0) skills[i.dataset.skill] = +i.value; });
  try {
    await api('/api/pcs', {method: 'POST', body: JSON.stringify({
      name: $('wz-name').value.trim(), klasse: $('wz-klasse').value,
      hintergrund: $('wz-hg').value.trim(), attribute, skills})});
    $('wizdlg').classList.remove('open');
    refreshState();
  } catch (e) { $('wz-err').textContent = e.message; }
};
$('protbtn').onclick = async () => {
  el('tool', 'Erzeuge Session-Protokoll ...');
  try {
    const r = await (await api('/api/protocol', {method: 'POST'})).json();
    el('dm', 'PROTOKOLL\n\n' + r.protokoll);
  } catch (e) { el('error', e.message); }
};

refreshState();
