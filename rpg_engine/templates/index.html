<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avarr — Solo RPG</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- New Game Modal -->
  <div id="new-game-modal" class="modal-overlay">
    <div class="modal-box">
      <h2>Begin Your Story</h2>
      <p class="modal-subtitle">Year 743 of the Imperial Calendar. Salzhaven awaits.</p>
      <div class="form-group">
        <label for="char-name">Character Name</label>
        <input type="text" id="char-name" placeholder="Enter your name..." maxlength="40">
      </div>
      <div class="form-group">
        <label>Class</label>
        <div id="class-list" class="class-grid">
          <!-- populated by JS -->
        </div>
      </div>
      <div class="form-group">
        <label>LLM Provider</label>
        <div style="display:flex;gap:8px;margin-bottom:8px;">
          <button type="button" class="provider-btn selected" data-provider="anthropic" onclick="selectProvider('anthropic')">Anthropic</button>
          <button type="button" class="provider-btn" data-provider="openrouter" onclick="selectProvider('openrouter')">OpenRouter</button>
        </div>
        <div style="position:relative;">
          <input type="password" id="api-key" placeholder="API key (stored in browser only)" autocomplete="off">
          <button type="button" id="key-toggle" onclick="toggleKeyVisibility()" title="Show/hide key">👁</button>
        </div>
        <div id="openrouter-model-row" style="margin-top:8px;display:none;">
          <input type="text" id="or-model" placeholder="Model (e.g. anthropic/claude-sonnet-4-5)" style="width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--text);padding:0.6rem 0.8rem;font-size:0.9rem;font-family:var(--font-ui);outline:none;">
          <div id="model-suggestions" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;"></div>
        </div>
      </div>

      <div id="modal-error" class="error-msg hidden"></div>
      <button id="start-btn" class="btn-primary">Begin</button>
      <div id="modal-loading" class="spinner hidden"></div>

      <div class="or-divider">— or —</div>
      <div id="saved-games">
        <p class="section-label">Continue a playthrough</p>
        <div id="saves-list">
          <!-- populated by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Main Game UI -->
  <div id="game-ui" class="hidden">
    <!-- Top Bar -->
    <header id="top-bar">
      <div class="top-bar-name" id="hdr-name">—</div>
      <div class="top-bar-stats">
        <span class="stat-hp" id="hdr-hp">HP: —/—</span>
        <span class="stat-gold" id="hdr-gold">Gold: —</span>
        <span class="stat-loc" id="hdr-loc">—</span>
        <span class="stat-time" id="hdr-time">—</span>
      </div>
      <button id="panel-toggle" class="btn-icon" title="Toggle side panel">&#9776;</button>
    </header>

    <!-- Main Layout -->
    <div id="main-layout">
      <!-- Chat Area -->
      <div id="chat-area">
        <div id="message-list">
          <!-- messages go here -->
        </div>
        <!-- Input -->
        <div id="input-bar">
          <textarea id="player-input" placeholder="What do you do?" rows="2" maxlength="500"></textarea>
          <button id="send-btn" class="btn-primary">Send</button>
        </div>
      </div>

      <!-- Side Panel -->
      <aside id="side-panel">
        <div class="panel-section">
          <h3>Skills</h3>
          <ul id="skills-list"></ul>
        </div>
        <div class="panel-section">
          <h3>Inventory</h3>
          <ul id="inventory-list"></ul>
        </div>
        <div class="panel-section">
          <h3>Active Quests</h3>
          <ul id="quests-list"></ul>
        </div>
        <div class="panel-section">
          <h3>Injuries</h3>
          <ul id="injuries-list"></ul>
        </div>
      </aside>
    </div>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────
    let state = {
      playthroughId: null,
      selectedClass: null,
      gameState: null,
      provider: 'anthropic',
      apiKey: '',
      model: ''
    };

    const OPENROUTER_MODELS = [
      'anthropic/claude-sonnet-4-5',
      'anthropic/claude-3-5-haiku',
      'openai/gpt-4o',
      'openai/gpt-4o-mini',
      'google/gemini-flash-1.5',
      'meta-llama/llama-3.3-70b-instruct',
      'mistralai/mistral-large',
      'deepseek/deepseek-chat',
    ];

    // ── Provider / Key UI ──────────────────────────────────
    function selectProvider(p) {
      state.provider = p;
      document.querySelectorAll('.provider-btn').forEach(b => {
        b.classList.toggle('selected', b.dataset.provider === p);
      });
      const modelRow = document.getElementById('openrouter-model-row');
      modelRow.style.display = p === 'openrouter' ? 'block' : 'none';
      if (p === 'openrouter' && !document.getElementById('model-suggestions').children.length) {
        renderModelSuggestions();
      }
      saveSettings();
    }

    function renderModelSuggestions() {
      const el = document.getElementById('model-suggestions');
      el.innerHTML = '';
      OPENROUTER_MODELS.forEach(m => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'model-suggestion';
        btn.textContent = m;
        btn.onclick = () => { document.getElementById('or-model').value = m; saveSettings(); };
        el.appendChild(btn);
      });
    }

    function toggleKeyVisibility() {
      const inp = document.getElementById('api-key');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    function saveSettings() {
      const key = document.getElementById('api-key').value;
      const model = document.getElementById('or-model')?.value || '';
      state.apiKey = key;
      state.model = model;
      try {
        localStorage.setItem('rpg_provider', state.provider);
        localStorage.setItem('rpg_api_key', key);
        localStorage.setItem('rpg_model', model);
      } catch(e) {}
    }

    function loadSettings() {
      try {
        const p = localStorage.getItem('rpg_provider') || 'anthropic';
        const k = localStorage.getItem('rpg_api_key') || '';
        const m = localStorage.getItem('rpg_model') || '';
        state.provider = p;
        state.apiKey = k;
        state.model = m;
        document.getElementById('api-key').value = k;
        if (document.getElementById('or-model')) document.getElementById('or-model').value = m;
        selectProvider(p);
      } catch(e) {}
    }

    // Save on input change
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('api-key').addEventListener('input', saveSettings);
      document.getElementById('or-model')?.addEventListener('input', saveSettings);
    });

    // ── Init ───────────────────────────────────────────────
    async function init() {
      loadSettings();
      await loadClasses();
      await loadSaves();
    }

    async function loadClasses() {
      try {
        const res = await fetch('/api/classes');
        const classes = await res.json();
        const grid = document.getElementById('class-list');
        grid.innerHTML = '';
        classes.forEach(cls => {
          const btn = document.createElement('button');
          btn.className = 'class-btn';
          btn.textContent = cls.name;
          btn.title = Object.entries(cls.starting_skills)
            .map(([k,v]) => `${k}: ${v}`).join(', ');
          btn.addEventListener('click', () => {
            document.querySelectorAll('.class-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            state.selectedClass = cls.name;
          });
          grid.appendChild(btn);
        });
      } catch(e) {
        console.error('loadClasses error', e);
      }
    }

    async function loadSaves() {
      try {
        const res = await fetch('/api/playthroughs');
        const saves = await res.json();
        const list = document.getElementById('saves-list');
        list.innerHTML = '';
        if (saves.length === 0) {
          list.innerHTML = '<p class="muted">No saved games.</p>';
          return;
        }
        saves.forEach(s => {
          const div = document.createElement('div');
          div.className = 'save-entry';
          div.innerHTML = `
            <span class="save-name">${escapeHtml(s.character_name)}</span>
            <span class="save-class">${escapeHtml(s.character_class)}</span>
            <span class="save-level">Lv ${s.level || 1}</span>
            <button class="btn-secondary" data-id="${s.id}">Continue</button>
          `;
          div.querySelector('button').addEventListener('click', () => continueGame(s.id));
          list.appendChild(div);
        });
      } catch(e) {
        console.error('loadSaves error', e);
      }
    }

    // ── New Game ───────────────────────────────────────────
    document.getElementById('start-btn').addEventListener('click', async () => {
      const name = document.getElementById('char-name').value.trim();
      const cls = state.selectedClass;
      const errEl = document.getElementById('modal-error');
      errEl.classList.add('hidden');

      if (!name) { showModalError('Enter a character name.'); return; }
      if (!cls) { showModalError('Select a class.'); return; }
      saveSettings();
      if (!state.apiKey && state.provider === 'openrouter') { showModalError('Enter an OpenRouter API key.'); return; }

      setModalLoading(true);
      try {
        const res = await fetch('/api/new_game', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            name, class: cls,
            api_key: state.apiKey || undefined,
            model: state.model || undefined,
            provider: state.provider
          })
        });
        const data = await res.json();
        if (!res.ok) { showModalError(data.error || 'Error starting game.'); return; }

        state.playthroughId = data.playthrough_id;
        state.gameState = data.game_state;
        enterGame();
        addMessage('narrator', data.narration);
        updateUI();
      } catch(e) {
        showModalError('Connection error. Is the server running?');
      } finally {
        setModalLoading(false);
      }
    });

    // ── Continue Game ──────────────────────────────────────
    async function continueGame(id) {
      try {
        const res = await fetch(`/api/game_state?playthrough_id=${id}`);
        const data = await res.json();
        if (!res.ok) { alert(data.error || 'Error loading game.'); return; }
        state.playthroughId = id;
        state.gameState = data;
        enterGame();
        addMessage('narrator', `Welcome back, ${data.name}. The story continues...`);
        updateUI();
      } catch(e) {
        alert('Connection error.');
      }
    }

    // ── Game UI ────────────────────────────────────────────
    function enterGame() {
      document.getElementById('new-game-modal').classList.add('hidden');
      document.getElementById('game-ui').classList.remove('hidden');
    }

    function updateUI() {
      const gs = state.gameState;
      if (!gs) return;

      document.getElementById('hdr-name').textContent = `${gs.name} · ${gs.class} · Lv ${gs.level}`;
      document.getElementById('hdr-hp').textContent = `HP ${gs.hp_current}/${gs.hp_max}`;
      document.getElementById('hdr-gold').textContent = `${gs.gold}g`;
      document.getElementById('hdr-loc').textContent = gs.current_scene_name || '—';

      const t = gs.time;
      document.getElementById('hdr-time').textContent =
        `${t.year}-${pad(t.month)}-${pad(t.day)} ${pad(t.hour)}:${pad(t.minute)}`;

      // HP color
      const hpEl = document.getElementById('hdr-hp');
      const hpPct = gs.hp_current / gs.hp_max;
      hpEl.className = 'stat-hp' + (hpPct <= 0.3 ? ' low' : hpPct <= 0.6 ? ' mid' : '');

      // Skills
      const skillsList = document.getElementById('skills-list');
      skillsList.innerHTML = '';
      (gs.skills || []).sort((a,b) => b.level - a.level).forEach(s => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="sk-name">${escapeHtml(s.skill_name)}</span><span class="sk-level">Lv ${s.level}</span>`;
        skillsList.appendChild(li);
      });

      // Inventory
      const invList = document.getElementById('inventory-list');
      invList.innerHTML = '';
      (gs.inventory || []).forEach(item => {
        const li = document.createElement('li');
        li.className = item.equipped ? 'equipped' : '';
        li.textContent = `${item.item_name}${item.quantity > 1 ? ` ×${item.quantity}` : ''}${item.equipped ? ' ★' : ''}`;
        invList.appendChild(li);
      });
      if (!gs.inventory || gs.inventory.length === 0) {
        invList.innerHTML = '<li class="muted">Empty</li>';
      }

      // Quests
      const questsList = document.getElementById('quests-list');
      questsList.innerHTML = '';
      (gs.quests || []).forEach(q => {
        const li = document.createElement('li');
        li.textContent = q.title;
        questsList.appendChild(li);
      });
      if (!gs.quests || gs.quests.length === 0) {
        questsList.innerHTML = '<li class="muted">None</li>';
      }

      // Injuries
      const injuriesList = document.getElementById('injuries-list');
      injuriesList.innerHTML = '';
      (gs.injuries || []).forEach(inj => {
        const li = document.createElement('li');
        li.className = 'injury';
        li.textContent = `${inj.injury_name} (${inj.affected_skill} ${inj.modifier > 0 ? '+' : ''}${inj.modifier})`;
        injuriesList.appendChild(li);
      });
      if (!gs.injuries || gs.injuries.length === 0) {
        injuriesList.innerHTML = '<li class="muted">None</li>';
      }
    }

    // ── Send Turn ──────────────────────────────────────────
    async function sendTurn() {
      const input = document.getElementById('player-input');
      const text = input.value.trim();
      if (!text) return;
      if (!state.playthroughId) return;

      const sendBtn = document.getElementById('send-btn');
      input.value = '';
      input.disabled = true;
      sendBtn.disabled = true;

      addMessage('player', text);
      const spinner = addSpinner();

      try {
        const res = await fetch('/api/turn', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            playthrough_id: state.playthroughId,
            input: text,
            api_key: state.apiKey || undefined,
            model: state.model || undefined,
            provider: state.provider
          })
        });
        const data = await res.json();
        removeSpinner(spinner);

        if (!res.ok) {
          addMessage('system', `Error: ${data.error || 'Unknown error'}`);
          return;
        }

        // Show engine result if relevant
        const er = data.engine_result;
        if (er && er.skill_result) {
          const sr = er.skill_result;
          const outcome = sr.outcome || '?';
          const outcomeClass = outcome.includes('CRITICAL') ? (outcome.includes('SUCCESS') ? 'crit-success' : 'crit-fail') :
                               outcome === 'SUCCESS' ? 'success' :
                               outcome === 'PARTIAL' ? 'partial' : 'fail';
          addMessage('roll', `
            <span class="roll-skill">${escapeHtml(sr.skill)}</span>
            <span class="roll-dice">🎲 ${sr.roll} + ${sr.modifier} = ${sr.total}</span>
            <span class="roll-vs">vs DC ${sr.dc}</span>
            <span class="roll-outcome ${outcomeClass}">${outcome.replace('_', ' ')}</span>
            <span class="roll-xp">+${sr.xp_gained} XP</span>
          `);
        }

        addMessage('narrator', data.narration);
        state.gameState = data.game_state;
        updateUI();
        scrollToBottom();

      } catch(e) {
        removeSpinner(spinner);
        addMessage('system', 'Connection error. Try again.');
      } finally {
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    document.getElementById('send-btn').addEventListener('click', sendTurn);
    document.getElementById('player-input').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendTurn();
      }
    });

    // ── Side Panel Toggle ──────────────────────────────────
    document.getElementById('panel-toggle').addEventListener('click', () => {
      document.getElementById('side-panel').classList.toggle('open');
    });

    // ── Helpers ────────────────────────────────────────────
    function addMessage(type, html) {
      const list = document.getElementById('message-list');
      const div = document.createElement('div');
      div.className = `msg msg-${type}`;
      if (type === 'player') {
        div.textContent = html;
      } else {
        div.innerHTML = html;
      }
      list.appendChild(div);
      scrollToBottom();
      return div;
    }

    function addSpinner() {
      const list = document.getElementById('message-list');
      const div = document.createElement('div');
      div.className = 'msg msg-spinner';
      div.innerHTML = '<span class="dots"><span>.</span><span>.</span><span>.</span></span>';
      list.appendChild(div);
      scrollToBottom();
      return div;
    }

    function removeSpinner(el) {
      if (el && el.parentNode) el.parentNode.removeChild(el);
    }

    function scrollToBottom() {
      const list = document.getElementById('message-list');
      list.scrollTop = list.scrollHeight;
    }

    function showModalError(msg) {
      const el = document.getElementById('modal-error');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function setModalLoading(on) {
      document.getElementById('modal-loading').classList.toggle('hidden', !on);
      document.getElementById('start-btn').disabled = on;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function pad(n) { return String(n).padStart(2, '0'); }

    // ── Start ──────────────────────────────────────────────
    init();
  </script>
</body>
</html>
